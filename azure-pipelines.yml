trigger:
  - main

pool:
  vmImage: 'macOS-latest'

steps:
# 1. Install Flutter (Crucial - The Xcode template doesn't do this)
- task: FlutterInstall@0
  inputs:
    mode: 'auto'
    channel: 'stable'
    version: 'latest'

# 2. Build iOS (Skips the $99 Fee check)
- script: |
    flutter build ios --release --no-codesign
  displayName: 'Build Flutter iOS'

# 3. Zip it into an IPA file so you can download it
- script: |
    cd build/ios/iphoneos
    mkdir Payload
    cp -r Runner.app Payload/
    zip -r Runner.ipa Payload
  displayName: 'Package into IPA'

# 4. Upload the file to Azure
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'build/ios/iphoneos/Runner.ipa'
    ArtifactName: 'drop'
    publishLocation: 'Container'