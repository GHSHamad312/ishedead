trigger:
  - main

pool:
  vmImage: 'macOS-latest'

steps:
# 1. Manually download Flutter (Fixes your "Missing Task" error)
- script: |
    git clone https://github.com/flutter/flutter.git -b stable --depth 1
    echo "##vso[task.prependpath]$(Build.SourcesDirectory)/flutter/bin"
    echo "##vso[task.prependpath]$(Build.SourcesDirectory)/flutter/bin/cache/dart-sdk/bin"
  displayName: 'Install Flutter Manually'

# 2. Build iOS (No Signing)
- script: |
    flutter build ios --release --no-codesign
  displayName: 'Build Flutter iOS'

# 3. Create the IPA file manually
- script: |
    cd build/ios/iphoneos
    mkdir Payload
    cp -r Runner.app Payload/
    zip -r Runner.ipa Payload
  displayName: 'Package into IPA'

# 4. Upload the IPA so you can download it
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'build/ios/iphoneos/Runner.ipa'
    ArtifactName: 'drop'
    publishLocation: 'Container'